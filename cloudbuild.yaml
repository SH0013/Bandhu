steps:
  # 1. Build Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/bandhu-agent:$COMMIT_SHA', '.']

  # 2. Push Container Image to Google Container Registry / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/bandhu-agent:$COMMIT_SHA']

  # 3. Deploy Container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'bandhu-agent'
      - '--image'
      - 'gcr.io/$PROJECT_ID/bandhu-agent:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'
      - '--set-env-vars'
      - 'ENVIRONMENT=production,USE_SQLITE_FALLBACK=false'

images:
  - 'gcr.io/$PROJECT_ID/bandhu-agent:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
